name: Lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  paths-filter:
    name: Paths Filter for Lint
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.filter.outputs.action }}
    steps:
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590
        id: filter
        with:
          filters: |
            action:
              - ".github/**"

  action:
    name: Lint GitHub Actions workflow files
    needs: paths-filter
    if: ${{ needs.paths-filter.outputs.action == 'true' || github.event_name == 'push'}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d
        with:
          reporter: github-pr-review
          fail_on_error: true
